services:
  # Spring Boot 3 Backend Web Service
  - type: web
    name: portfolio-cms-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/projects
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-cms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DEFAULT_ADMIN_USERNAME
        value: admin
      - key: DEFAULT_ADMIN_PASSWORD
        value: admin123

databases:
  # PostgreSQL Cloud Database
  - name: portfolio-cms-db
    databaseName: portfolio_db
    user: portfolio_user
    plan: free
    region: oregon
