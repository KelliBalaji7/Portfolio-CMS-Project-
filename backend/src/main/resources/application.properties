# Server Configuration
server.port=${PORT:${SERVER_PORT:8080}}

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration (for CMS media management)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application JWT and Security Configuration
app.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXN1cGVyLXNlY3JldC1qd3Qta2V5LXRoYXQtaXMtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.upload.dir=${UPLOAD_DIR:./uploads}

# Default Admin Seed Credentials
app.admin.username=${DEFAULT_ADMIN_USERNAME:admin}
app.admin.password=${DEFAULT_ADMIN_PASSWORD:admin123}
